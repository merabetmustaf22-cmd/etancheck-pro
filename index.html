<script id="stock-revamp-v1">
(function () {
  function initStockRevamp() {
    const sec = document.getElementById('site-section-stock');
    if (!sec) return;

    // 1. Remplacement automatique de la structure HTML de la section Stock
    sec.innerHTML = `
      <div id="stock-kpi-bar" class="grid grid-cols-3 gap-2"></div>

      <div class="flex items-center gap-2">
        <button type="button" onclick="openNewStockItemModal()" class="flex-1 h-10 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition">
          <i class="ph-bold ph-plus-circle text-sm"></i> Entrée / Produit
        </button>
        <button type="button" onclick="openConsumeModal()" class="flex-1 h-10 px-3 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-800 dark:text-amber-300 hover:bg-amber-500 hover:text-white text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95 transition">
          <i class="ph-bold ph-arrow-circle-up-right text-sm"></i> Déclarer Sortie
        </button>
      </div>

      <div class="flex items-center p-1 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-[11px] font-bold">
        <button type="button" id="stock-view-btn-inv" onclick="switchStockView('inventory')" class="flex-1 py-1.5 rounded-lg text-center bg-white dark:bg-slate-900 text-blue-600 dark:text-white shadow-sm transition flex items-center justify-center gap-1.5">
          <i class="ph-bold ph-package"></i> Inventaire chantier
        </button>
        <button type="button" id="stock-view-btn-cons" onclick="switchStockView('consumptions')" class="flex-1 py-1.5 rounded-lg text-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition flex items-center justify-center gap-1.5">
          <i class="ph-bold ph-clipboard-text"></i> Journal des sorties
        </button>
      </div>

      <div id="stock-subview-inventory" class="space-y-2.5">
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <i class="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input id="stock-search-input" type="search" placeholder="Filtrer par code ou nom..." oninput="setStockSearch(this.value)" class="w-full h-9 pl-8 pr-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs outline-none focus:border-blue-500" />
          </div>
          <button type="button" id="stock-reappro-wa-btn" onclick="shareStockReapproWhatsApp()" class="h-9 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1.5 shrink-0 shadow-sm active:scale-95 transition" title="Envoyer la liste des matériaux à commander sur WhatsApp">
            <i class="ph-bold ph-whatsapp-logo text-sm"></i> Réappro
          </button>
        </div>
        <div id="stock-container" class="space-y-2"></div>
      </div>

      <div id="stock-subview-consumptions" class="space-y-2.5 hidden">
        <div class="flex items-center justify-between gap-2">
          <select id="cons-phase-filter" onchange="setConsPhaseFilter(this.value)" class="h-9 px-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold flex-1">
            <option value="all">Toutes les phases</option>
            <option value="pv">1. Pare-Vapeur</option>
            <option value="fp">2. Forme de Pente</option>
            <option value="ela">3. Elastotek PU</option>
            <option value="sc">4. Sous-Carrelage</option>
            <option value="eau">Bâche à eau</option>
          </select>
          <button type="button" onclick="shareConsumptionWhatsApp()" class="h-9 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1.5 shrink-0 shadow-sm active:scale-95 transition">
            <i class="ph-bold ph-whatsapp-logo text-sm"></i> Bilan WhatsApp
          </button>
        </div>
        <div id="consumptions-summary" class="space-y-1.5"></div>
        <div id="consumptions-container" class="space-y-2"></div>
      </div>
    `;

    // 2. État et fonctions globales
    window.STOCK_UI = { filter: 'all', search: '', consPhase: 'all' };

    window.setStockFilter = function (f) {
      window.STOCK_UI.filter = (window.STOCK_UI.filter === f) ? 'all' : f;
      if (typeof switchStockView === 'function') switchStockView('inventory');
      window.renderStock();
    };

    window.setStockSearch = function (q) {
      window.STOCK_UI.search = String(q || '').toLowerCase().trim();
      window.renderStock();
    };

    window.setConsPhaseFilter = function (p) {
      window.STOCK_UI.consPhase = p || 'all';
      window.renderConsumptions();
    };

    window.quickAdjustStock = function (itemId, delta) {
      const sd = state[activeSite] || {};
      const item = (sd.stock || []).find(i => i.id === itemId);
      if (!item) return;
      const next = Math.max(0, Math.round(((Number(item.qty) || 0) + delta) * 100) / 100);
      if (next === item.qty) return;
      item.qty = next;
      if (delta < 0) {
        if (!Array.isArray(sd.consumptions)) sd.consumptions = [];
        sd.consumptions.unshift({
          id: 'c_' + Date.now(),
          itemId: item.id,
          code: item.code || '',
          name: item.name,
          qty: Math.abs(delta),
          unit: item.unit || 'Unité',
          area: '',
          phase: 'ela',
          workerName: 'Ajustement rapide',
          date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }),
          time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
          notes: 'Sortie rapide (-1) depuis l\'inventaire'
        });
      }
      saveState();
      window.renderStock();
      window.renderConsumptions();
      if (typeof updateNotifications === 'function') updateNotifications();
    };

    window.toggleStockOrdered = function (itemId) {
      const item = ((state[activeSite] || {}).stock || []).find(i => i.id === itemId);
      if (!item) return;
      item.ordered = !item.ordered;
      saveState();
      window.renderStock();
      if (typeof updateNotifications === 'function') updateNotifications();
      if (typeof ecToast === 'function') ecToast(item.ordered ? 'Marqué comme commandé.' : 'Statut commande retiré.');
    };

    window.openConsumeFor = function (itemId) {
      if (typeof openConsumeModal === 'function') openConsumeModal();
      const sel = document.getElementById('consume-product-select');
      if (sel) {
        sel.value = itemId;
        if (typeof onSelectConsumeProduct === 'function') onSelectConsumeProduct(itemId);
      }
    };

    window.shareStockReapproWhatsApp = function () {
      const sd = state[activeSite] || {};
      const low = (sd.stock || []).filter(i => (Number(i.qty) || 0) <= (Number(i.min) || 0));
      if (!low.length) {
        if (typeof ecToast === 'function') ecToast('Aucun article sous le seuil minimal.');
        return;
      }
      let m = waHead('DEMANDE DE RÉAPPROVISIONNEMENT', [['Articles critiques', low.length + ' référence(s)']]);
      m = m.concat(waSec('Matériaux à approvisionner', low.map(i => {
        const target = Math.max((Number(i.min) || 1) * 2, (Number(i.min) || 1) + 2);
        const need = Math.max(1, Math.ceil(target - (Number(i.qty) || 0)));
        return '• *[' + (i.code || 'REF') + '] ' + i.name + '*\n' +
               '   Reste : ' + waN(i.qty, 1) + ' ' + (i.unit || '') + ' (seuil ' + i.min + ') → *Commander : +' + need + ' ' + (i.unit || '') + '*';
      })));
      waSend(m, 'Demande générée depuis EtanCheck Pro');
    };

    // 3. Surcharge du rendu Inventaire
    window.renderStock = function () {
      const sd = state[activeSite] || {};
      const all = sd.stock || [];
      const kpiBar = document.getElementById('stock-kpi-bar');
      const box = document.getElementById('stock-container');
      if (!box) return;

      const lowItems = all.filter(i => (Number(i.qty) || 0) <= (Number(i.min) || 0));
      const ordItems = all.filter(i => i.ordered);

      if (kpiBar) {
        const kpiCard = (key, val, label, cls, activeCls) => {
          const on = window.STOCK_UI.filter === key;
          return '<button type="button" onclick="setStockFilter(\'' + key + '\')" class="p-2.5 rounded-2xl border text-left transition active:scale-95 ' +
            (on ? activeCls : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800') + '">' +
            '<div class="text-lg font-black font-mono leading-none ' + cls + '">' + val + '</div>' +
            '<div class="text-[10px] font-bold text-slate-500 mt-1">' + label + '</div>' +
          '</button>';
        };
        kpiBar.innerHTML =
          kpiCard('all', all.length, 'Références', 'text-slate-900 dark:text-white', 'bg-blue-50 dark:bg-slate-800 border-blue-500') +
          kpiCard('low', lowItems.length, 'Sous seuil', lowItems.length ? 'text-rose-600' : 'text-emerald-600', 'bg-rose-50 dark:bg-rose-950/30 border-rose-500') +
          kpiCard('ordered', ordItems.length, 'Commandés', 'text-amber-600', 'bg-amber-50 dark:bg-amber-950/30 border-amber-500');
      }

      const filtered = all.filter(i => {
        if (window.STOCK_UI.filter === 'low' && !((Number(i.qty) || 0) <= (Number(i.min) || 0))) return false;
        if (window.STOCK_UI.filter === 'ordered' && !i.ordered) return false;
        if (window.STOCK_UI.search) {
          const hay = ((i.code || '') + ' ' + (i.name || '')).toLowerCase();
          if (!hay.includes(window.STOCK_UI.search)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        const ra = a.qty === 0 ? 0 : (a.qty <= a.min ? 1 : 2);
        const rb = b.qty === 0 ? 0 : (b.qty <= b.min ? 1 : 2);
        return ra - rb || String(a.name).localeCompare(String(b.name));
      });

      if (!filtered.length) {
        box.innerHTML = '<div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 text-center space-y-1">' +
          '<div class="text-xs font-bold text-slate-600 dark:text-slate-300">Aucun matériau trouvé</div>' +
          '<div class="text-[10px] text-slate-400">Modifiez le filtre ou ajoutez une entrée de stock.</div>' +
        '</div>';
        return;
      }

      box.innerHTML = filtered.map(item => {
        const qty = Number(item.qty) || 0;
        const min = Math.max(1, Number(item.min) || 1);
        const isEmpty = qty === 0;
        const isLow = qty <= min;
        const pct = Math.min(100, Math.round((qty / (min * 2)) * 100));

        const barCol = isEmpty ? 'bg-rose-600' : (isLow ? 'bg-amber-500' : 'bg-emerald-500');
        const borderCol = isEmpty ? 'border-l-4 border-l-rose-600' : (isLow ? 'border-l-4 border-l-amber-500' : '');
        const badge = isEmpty
          ? '<span class="px-1.5 py-0.5 rounded bg-rose-500/15 text-rose-700 dark:text-rose-300 text-[9px] font-black">Rupture</span>'
          : (isLow
              ? '<span class="px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-800 dark:text-amber-300 text-[9px] font-black">Stock bas</span>'
              : '<span class="px-1.5 py-0.5 rounded bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 text-[9px] font-black">OK</span>');
        const ordBadge = item.ordered
          ? '<span class="px-1.5 py-0.5 rounded bg-blue-500/15 text-blue-700 dark:text-blue-300 text-[9px] font-black">Commandé</span>'
          : '';

        const sid = jsq(item.id);
        return '<div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 ' + borderCol + ' space-y-2.5">' +
          '<div class="flex items-start justify-between gap-2">' +
            '<div class="min-w-0 flex-1">' +
              '<div class="flex items-center gap-1.5 flex-wrap">' +
                '<span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 font-mono text-[10px] font-bold text-slate-600 dark:text-slate-300">' + ech(item.code || 'REF') + '</span>' +
                badge + ordBadge +
              '</div>' +
              '<div class="text-xs font-bold text-slate-900 dark:text-white mt-1 leading-snug">' + ech(item.name) + '</div>' +
            '</div>' +
            '<div class="text-right shrink-0">' +
              '<div class="text-base font-black font-mono leading-none ' + (isEmpty ? 'text-rose-600' : (isLow ? 'text-amber-600' : 'text-slate-900 dark:text-white')) + '">' +
                waN(qty, 1) + ' <span class="text-[10px] font-semibold text-slate-500">' + ech(item.unit || '') + '</span>' +
              '</div>' +
              '<div class="text-[10px] text-slate-400 font-mono mt-1">Seuil : ' + min + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="w-full h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">' +
            '<div class="h-full rounded-full ' + barCol + ' transition-all" style="width:' + Math.max(4, pct) + '%"></div>' +
          '</div>' +

          '<div class="flex items-center justify-between gap-1.5 pt-1 border-t border-slate-100 dark:border-slate-800">' +
            '<div class="flex items-center gap-1">' +
              '<button type="button" onclick="quickAdjustStock(\'' + sid + '\', -1)" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-rose-500/15 text-slate-700 dark:text-slate-200 font-black text-sm flex items-center justify-center active:scale-90 transition" title="Sortie rapide -1">−</button>' +
              '<button type="button" onclick="quickAdjustStock(\'' + sid + '\', 1)" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-emerald-500/15 text-slate-700 dark:text-slate-200 font-black text-sm flex items-center justify-center active:scale-90 transition" title="Entrée rapide +1">+</button>' +
              '<button type="button" onclick="openConsumeFor(\'' + sid + '\')" class="h-8 px-2.5 rounded-lg bg-amber-500/15 text-amber-800 dark:text-amber-300 text-[10px] font-bold flex items-center gap-1 active:scale-95 transition">Sortie</button>' +
            '</div>' +
            '<div class="flex items-center gap-1">' +
              (isLow ? '<button type="button" onclick="toggleStockOrdered(\'' + sid + '\')" class="h-8 px-2.5 rounded-lg ' + (item.ordered ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300') + ' text-[10px] font-bold active:scale-95 transition">' + (item.ordered ? '✓ Commandé' : 'Commander') + '</button>' : '') +
              (typeof openSheet === 'function' ? '<button type="button" onclick="openSheet(\'' + sid + '\')" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500 flex items-center justify-center" title="Fiche technique & photos"><i class="ph-bold ph-info"></i></button>' : '') +
              '<button type="button" onclick="twoTap(this, function(){ deleteStockItem(\'' + sid + '\'); }, \'Supprimer ?\')" class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-600 flex items-center justify-center" title="Supprimer l\'article"><i class="ph-bold ph-trash"></i></button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    };

    // 4. Surcharge du rendu Consommations
    window.renderConsumptions = function () {
      const sd = state[activeSite] || {};
      const all = sd.consumptions || [];
      const sumBox = document.getElementById('consumptions-summary');
      const box = document.getElementById('consumptions-container');
      if (!box) return;

      const list = all.filter(c => window.STOCK_UI.consPhase === 'all' || c.phase === window.STOCK_UI.consPhase);

      if (sumBox) {
        const totals = {};
        list.forEach(c => {
          const k = (c.name || 'Article') + '|' + (c.unit || '');
          if (!totals[k]) totals[k] = { name: c.name, unit: c.unit || '', qty: 0, area: 0 };
          totals[k].qty += Number(c.qty) || 0;
          totals[k].area += Number(c.area) || 0;
        });
        const rows = Object.values(totals);
        sumBox.innerHTML = rows.length
          ? '<div class="p-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-1.5">' +
              '<div class="text-[10px] font-black uppercase text-slate-400">Cumul consommé (' + list.length + ' mouvement(s))</div>' +
              rows.map(r =>
                '<div class="flex items-center justify-between text-xs">' +
                  '<span class="font-bold text-slate-800 dark:text-slate-200 truncate pr-2">' + ech(r.name) + '</span>' +
                  '<span class="font-mono font-black text-amber-700 dark:text-amber-300 shrink-0">' +
                    waN(r.qty, 1) + ' ' + ech(r.unit) + (r.area ? ' · ' + r.area + ' m²' : '') +
                  '</span>' +
                '</div>'
              ).join('') +
            '</div>'
          : '';
      }

      if (!list.length) {
        box.innerHTML = '<div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-dashed border-slate-300 dark:border-slate-700 text-center text-xs font-bold text-slate-500">Aucune sortie enregistrée pour ce filtre.</div>';
        return;
      }

      const groups = {};
      list.forEach(c => {
        const d = c.date || 'Date non précisée';
        if (!groups[d]) groups[d] = [];
        groups[d].push(c);
      });

      box.innerHTML = Object.keys(groups).map(date => {
        const itemsHtml = groups[date].map(c => {
          const phaseLabel = (typeof WA_PHASE !== 'undefined' && WA_PHASE[c.phase]) ? WA_PHASE[c.phase] : 'Chantier';
          return '<div class="p-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-start justify-between gap-2">' +
            '<div class="min-w-0 flex-1">' +
              '<div class="flex items-center gap-1.5 flex-wrap">' +
                '<span class="px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-800 dark:text-amber-300 text-[9px] font-black">' + ech(phaseLabel) + '</span>' +
                (c.time ? '<span class="text-[10px] font-mono text-slate-400">' + ech(c.time) + '</span>' : '') +
              '</div>' +
              '<div class="text-xs font-bold text-slate-900 dark:text-white mt-1">' + ech(c.name) + '</div>' +
              '<div class="text-[10px] text-slate-500 mt-0.5">' +
                ech(c.workerName || 'Équipe') +
                (c.area ? ' · Surface : <b>' + ech(c.area) + ' m²</b>' : '') +
                (c.notes ? ' — ' + ech(c.notes) : '') +
              '</div>' +
            '</div>' +
            '<div class="text-right shrink-0">' +
              '<span class="text-sm font-black font-mono text-rose-600">-' + waN(c.qty, 1) + '</span>' +
              '<div class="text-[10px] text-slate-400">' + ech(c.unit || '') + '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        return '<div class="space-y-1.5">' +
          '<div class="text-[10px] font-black uppercase text-slate-400 px-1 pt-1">' + ech(date) + '</div>' +
          itemsHtml +
        '</div>';
      }).join('');
    };

    // Relance un rendu si l'état est déjà chargé
    if (typeof state !== 'undefined' && state[activeSite]) {
      window.renderStock();
      window.renderConsumptions();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => setTimeout(initStockRevamp, 0));
  } else {
    setTimeout(initStockRevamp, 0);
  }
})();
</script>
